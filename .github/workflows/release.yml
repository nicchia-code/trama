name: Release

# Builds the platform .vsix files on their own OS (so the macOS CLI is signed ad hoc by Bun on a Mac), runs the
# tests there and, only when all three platforms pass, creates the tag v<package.json version> and its prerelease
# together, on the run's commit. The workflow starts by hand only (`gh workflow run release.yml --ref <branch>`), from
# any branch, and takes no input. A tag that already exists stops the run before any package is built, and the workflow
# never moves, deletes or rewrites a tag: a failed run is fixed with a new commit and a new run on the same version.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          # Authenticated lookup (works on private repositories too). matching-refs matches by prefix, so keep the exact ref.
          # A failed call fails the job: it must never read as "the tag is absent".
          found=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length") || {
            echo "::error::Could not check whether the tag $tag exists. Run the workflow again."
            exit 1
          }
          # A release with no tag (a draft) also counts; a failed call here is only a missing extra signal.
          if [ "$found" -ne 0 ] || gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::The tag $tag already exists on the repository (with or without a release). Raise the version in package.json and run the workflow again."
            exit 1
          fi

  package:
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: macos-14, target: darwin-arm64 }
          - { os: windows-latest, target: win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # The suite runs under a watchdog: after 3 minutes without output it is stopped, with its processes, and the step
      # fails naming the test file in progress.
      - run: bun run test:ci
      - run: bun run package ${{ matrix.target }}
      - name: Smoke-test the packaged CLI
        if: runner.os != 'Windows'
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../dist/trama-${{ matrix.target }}-*.vsix 'extension/bin/trama'
          ./extension/bin/trama --help | head -1
          mkdir project && ./extension/bin/trama --root project project new && ./extension/bin/trama --root project model check
      - name: Smoke-test the packaged CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Trama([string[]] $Arguments) {
            & "./extension/bin/trama.exe" @Arguments
            if ($LASTEXITCODE -ne 0) { throw "trama $($Arguments -join ' ') exited with $LASTEXITCODE" }
          }
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item "dist/trama-${{ matrix.target }}-*.vsix" smoke/package.zip
          Set-Location smoke
          Expand-Archive package.zip -DestinationPath . -Force
          Invoke-Trama @("--help")
          New-Item -ItemType Directory project | Out-Null
          Invoke-Trama @("--root", "project", "project", "new")
          Invoke-Trama @("--root", "project", "model", "check")
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --verbose smoke/extension/bin/trama
      - uses: actions/upload-artifact@v4
        with:
          name: trama-${{ matrix.target }}
          path: dist/*.vsix

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is named after the version in package.json; creating it creates the tag on the run's commit.
          tag="v$(jq -r .version package.json)"
          notes="Install with: code --install-extension trama-<platform>-<version>.vsix"
          if ls packages/*win32-x64*.vsix > /dev/null 2>&1; then
            notes="$notes"$'\n\n'"**Windows is untested by hand.** The win32-x64 package is built, tested (the full suite must pass) and smoke-tested (\`--help\`, \`project new\`, \`model check\`) on a Windows CI runner, but nobody has tried it by hand on a Windows machine, with VS Code and omp. Expect rough edges and please report them."
          fi
          gh release create "$tag" packages/*.vsix --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Trama $tag" --prerelease --notes "$notes"
