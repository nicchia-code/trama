name: Release

# Builds the platform .vsix files on their own OS (so the macOS CLI is signed ad hoc by Bun on a Mac), runs the
# tests there, and attaches the packages to a GitHub release when a `v*` tag is pushed. A manual run builds the
# chosen target (default all) and creates the release v<package.json version> from the run's commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build and release
        type: choice
        default: all
        options: [all, linux-x64, darwin-arm64, win32-x64]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          TARGET: ${{ inputs.target }}
        run: |
          all='[{"os":"ubuntu-latest","target":"linux-x64"},{"os":"macos-14","target":"darwin-arm64"},{"os":"windows-latest","target":"win32-x64"}]'
          if [ -n "$TARGET" ] && [ "$TARGET" != all ]; then all=$(jq -c --arg t "$TARGET" 'map(select(.target == $t))' <<< "$all"); fi
          echo "matrix={\"include\":$all}" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test --isolate
      - run: bun run package ${{ matrix.target }}
      - name: Smoke-test the packaged CLI
        if: runner.os != 'Windows'
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../dist/trama-${{ matrix.target }}-*.vsix 'extension/bin/trama'
          ./extension/bin/trama --help | head -1
          mkdir project && ./extension/bin/trama --root project project new && ./extension/bin/trama --root project model check
      - name: Smoke-test the packaged CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Trama([string[]] $Arguments) {
            & "./extension/bin/trama.exe" @Arguments
            if ($LASTEXITCODE -ne 0) { throw "trama $($Arguments -join ' ') exited with $LASTEXITCODE" }
          }
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item "dist/trama-${{ matrix.target }}-*.vsix" smoke/package.zip
          Set-Location smoke
          Expand-Archive package.zip -DestinationPath . -Force
          Invoke-Trama @("--help")
          $answer = '{}' | & "./extension/bin/trama.exe" hook copilot
          if ($LASTEXITCODE -ne 0 -or ($answer | Out-String).Trim() -ne "{}") { throw "hook copilot must answer {} with exit 0, got: $answer" }
          New-Item -ItemType Directory project | Out-Null
          Invoke-Trama @("--root", "project", "project", "new")
          Invoke-Trama @("--root", "project", "model", "check")
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --verbose smoke/extension/bin/trama
      - uses: actions/upload-artifact@v4
        with:
          name: trama-${{ matrix.target }}
          path: dist/*.vsix

  release:
    needs: package
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag names the release; a manual run names it after the version in package.json and creates the tag.
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(jq -r .version package.json)"; fi
          notes="Install with: code --install-extension trama-<platform>-<version>.vsix"
          if ls packages/*win32-x64*.vsix > /dev/null 2>&1; then
            notes="$notes"$'\n\n'"**Windows is untested by hand.** The win32-x64 package is built, tested (the full suite must pass) and smoke-tested (\`--help\`, \`project new\`, \`model check\`, \`hook copilot\`) on a Windows CI runner, but nobody has tried it by hand on a Windows machine, in VS Code or in Cursor. Cursor's hook form on Windows (\`& \"<trama.exe>\" hook cursor\`) is a guess. Expect rough edges and please report them."
          fi
          gh release create "$tag" packages/*.vsix --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Trama $tag" --prerelease --notes "$notes"
