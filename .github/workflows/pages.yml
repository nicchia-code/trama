name: Pages

# Builds the documentation site (`site/`) with Bun and publishes it to GitHub Pages at https://nicchia-code.github.io/trama/.
# It runs when the site, its images, the extension's settings (the guide's Settings page is generated from them) or the dependencies change.
# The repository's Pages source must be "GitHub Actions" (Settings → Pages).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "extension/package.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a deploy that is running is never cancelled by a newer one: the newer one waits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
