name: CI debug
on:
  push:
    branches: [ci-debug-mac]
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        files:
          - test/published-issues.test.ts
          - test/host-ntfy-settings.test.ts test/host-delete-task.test.ts test/focus.test.tsx test/site-reveal.test.ts test/host-task-check.test.ts test/published-issues.test.ts test/host-solo-merge.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: repeated
        run: |
          set +e
          for i in $(seq 1 10); do
            echo "=== run $i"
            bun test --isolate ${{ matrix.files }} > out.txt 2>&1 &
            pid=$!
            for t in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then
              echo "HANG"
              tail -40 out.txt
              ps -axo pid,ppid,stat,etime,command | grep -E 'bun|git' | grep -v grep
              sample $pid 3 -file sample.txt > /dev/null 2>&1
              grep -E 'Thread_|^ +[0-9]+ ' sample.txt | head -120
              pkill -9 -P $pid; kill -9 $pid
            else
              wait $pid
              grep -E ' [0-9]+ (pass|fail)$' out.txt | tr '\n' ' '; echo
            fi
          done
